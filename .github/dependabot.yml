version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      workers-vitest:
        applies-to: version-updates
        patterns:
          - "wrangler"
          - "@cloudflare/vitest-pool-workers"
          - "vitest"
          - "@vitest/*"
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-major:
        applies-to: version-updates
        update-types:
          - major
    ignore:
      # @types/node major versions track Node.js major versions. This project
      # pins Node in .nvmrc and engines.node, and tsconfig.json compiles against
      # ["node"], so types from a newer major would describe APIs the runtime
      # does not have. It moves when the Node version does, in the same change.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # @cloudflare/vitest-pool-workers 0.23 (its last 0.x) peers on Vitest ^4.1, so a
      # Vitest 5 bump cannot install. Remove this when moving to the successor
      # @cloudflare/vitest-plugin, which accepts Vitest 5.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      actions-major:
        applies-to: version-updates
        update-types:
          - major
