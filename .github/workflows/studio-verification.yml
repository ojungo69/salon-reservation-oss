name: Verify image-first studio UI
on:
  push:
    branches: [chore/studio-ui-verification]
    paths: [.github/workflows/studio-verification.yml, .session/**, public/studio.*, test/studio.test.ts, tests-browser/studio.spec.ts]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install -g --ignore-scripts npm@12.0.2
      - run: npm ci --ignore-scripts
      - run: npm install-scripts ls --json | jq -e '.allowScripts == []'
      - run: ./node_modules/.bin/playwright install chromium
      - name: Integrate the bounded visual slice
        run: |
          python3 .session/apply-studio.py
          rm .github/workflows/studio-verification.yml
      - name: Verify application and release gates
        run: npm run check
      - name: Verify rendered flows and capture visual evidence
        run: npm run test:browser
      - name: Commit only verified public changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git restore --source=HEAD -- .github/workflows/studio-verification.yml
          expected=$(printf '%s\n' package.json public/404.html public/admin.html public/app.js public/bookings.html public/cancellation.html public/index.html public/line.html public/privacy.html public/setup.html public/terms.html release/public-files.txt)
          actual=$(git diff --name-only | LC_ALL=C sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json public release/public-files.txt
          git -c commit.gpgsign=false commit -m 'feat: integrate verified studio booking and operator surfaces'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/chore/studio-ui-verification
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: studio-browser-evidence
          path: .playwright
          include-hidden-files: true
          retention-days: 1
