name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false

      # Node 24.16.0 bundles npm 11.13.0, which has no allowScripts allowlist at
      # all. Corepack could pin npm, but it is experimental and gone by default
      # in Node 25, and setup-node has no npm-version input, so an explicit
      # global install is the durable way to run the documented npm.
      # npm itself declares no install script, so --ignore-scripts changes
      # nothing here beyond keeping the workflow uniformly script-free.
      - name: Pin npm
        run: npm install -g --ignore-scripts npm@12.0.2

      - name: Report toolchain
        run: node --version && npm --version

      # --ignore-scripts skips every dependency install script uniformly, so no
      # third-party install code runs in CI at all. It also short-circuits before
      # the per-package allowScripts check, which is why the allowlist is
      # verified by its own step below rather than as a side effect of the
      # install. CI has never needed an install script to produce a green build.
      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # Makes the reviewed allowlist real rather than decorative: the listing is
      # non-empty as soon as an installed package has an install script that no
      # one has approved. `jq -e` rather than a string comparison because npm
      # prints `{"error": …}` to stdout on any failure, where `.allowScripts`
      # is null, `length` is 0, and a comparison against 0 would pass. It only
      # covers what installs here, so an optional dependency excluded by `os`
      # or `cpu` is left to `strict-allow-scripts` on the machine it installs on.
      - name: Verify the install-script allowlist covers every installed script
        run: npm install-scripts ls --json | jq -e '.allowScripts == []'

      - name: Verify
        run: npm run check

      # Browser binaries live under ~/.cache/ms-playwright and only change when
      # the pinned @playwright/test version bumps; the key hashes the whole
      # lockfile, so unrelated dependency changes merely re-download the same
      # browser. Exact key, no restore-keys: a stale browser for a new
      # Playwright must never restore silently.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # The rendered-page tests need a real browser. Only Chromium is installed,
      # and without --with-deps, because the ubuntu-latest image already carries
      # the shared libraries the headless shell links against. Installing it
      # here rather than through an install script keeps the allowlist empty.
      - name: Install the browser the rendered-page tests drive
        run: ./node_modules/.bin/playwright install chromium

      - name: Verify the rendered pages
        run: npm run test:browser

      # Only produced by a failing run. The suite enters fictional fixtures
      # only, never a real credential or customer detail, so nothing sensitive
      # can reach the artifact; it expires quickly regardless.
      - name: Keep a failing run's traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-page-failures
          path: .playwright
          retention-days: 3
