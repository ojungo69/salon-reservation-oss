name: Export pinned development workspace
on:
  push:
    branches: [chore/session-workspace-export]
    paths: [.github/workflows/session-workspace-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 149133087137c76a0cc8e2df3b147bc7d37534ab
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare locked development dependencies
        run: |
          npm install -g --ignore-scripts npm@12.0.2
          npm ci --ignore-scripts
          npm install-scripts ls --json | jq -e '.allowScripts == []'
          npm audit --audit-level=high
      - name: Export only public source and installed development tools
        run: |
          mkdir -p /tmp/offline-workspace/source /tmp/offline-workspace/toolchain/bin /tmp/offline-workspace/toolchain/lib/node_modules
          git archive HEAD | tar -x -C /tmp/offline-workspace/source
          git bundle create /tmp/offline-workspace/source.bundle --all
          cp "$(command -v node)" /tmp/offline-workspace/toolchain/bin/node
          cp -a "$(npm root -g)/npm" /tmp/offline-workspace/toolchain/lib/node_modules/npm
          cp -a node_modules /tmp/offline-workspace/source/node_modules
          tar -czf /tmp/development-workspace.tar.gz -C /tmp/offline-workspace .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pinned-development-workspace
          path: /tmp/development-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
